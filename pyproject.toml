[project]
name = "deliver"
version = "0.1.0"
description = "FastAPI server for delivering stock data files"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "polars-lts-cpu>=1.0.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
